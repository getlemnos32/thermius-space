<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermius Space Systems</title>
<meta name="description" content="Thermius Space Systems. Thermal and test solutions for space systems. St. Petersburg, Florida.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.5' stop-color='%237d8591'/%3E%3Cstop offset='1' stop-color='%23e6eaee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%2307080b'/%3E%3Cpath d='M14 18h36v7H36v23h-8V25H14z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07080b; --ink:#e9ecf0; --muted:#8a919d; --line:#1e222b; --heat:#ff7a3c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(900px 420px at 50% 38%, rgba(160,175,200,0.10), transparent 70%),
      radial-gradient(1200px 500px at 50% 120%, rgba(255,122,60,0.10), transparent 65%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  main { flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 20px; }
  h1 {
    font-family:"Syncopate","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(32px, 11vw, 140px);
    letter-spacing:0.06em;
    margin-right:-0.06em;
    line-height:1;
    white-space:nowrap;
    background-image:
      linear-gradient(100deg, transparent 42%, rgba(255,255,255,0.85) 50%, transparent 58%),
      linear-gradient(180deg, #ffffff 0%, #eef1f5 22%, #c3c9d2 40%, #7d8591 50%, #dfe4ea 56%, #ffffff 74%, #c9cfd7 100%);
    background-size: 250% 100%, 100% 100%;
    background-position: 130% 0, 0 0;
    background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.10)) drop-shadow(0 10px 24px rgba(0,0,0,0.65));
    animation: sheen 7s ease-in-out 1.2s infinite;
  }
  @keyframes sheen { 0%,60% { background-position:130% 0, 0 0; } 85%,100% { background-position:-30% 0, 0 0; } }
  @media (prefers-reduced-motion: reduce) { h1 { animation:none; } }
  .sub {
    margin-top:clamp(14px,2.4vh,22px);
    font-size:clamp(11px,1.5vw,15px);
    letter-spacing:0.62em; margin-right:-0.62em;
    text-transform:uppercase; color:#aab1bc; font-weight:500;
  }
  .rule { width:min(420px,64vw); height:1px; margin:clamp(28px,5vh,44px) 0;
    background:linear-gradient(90deg, transparent, #59606b 20%, var(--heat) 50%, #59606b 80%, transparent); }
  .line { font-size:clamp(16px,2.1vw,20px); color:#c5cad2; line-height:1.5; max-width:28em; }
  .contact { margin-top:clamp(26px,5vh,40px); display:flex; flex-wrap:wrap; justify-content:center; gap:10px 28px; font-size:14px; color:var(--muted); letter-spacing:0.04em; }
  .contact a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--heat); padding-bottom:2px; }
  .contact a:hover, .contact a:focus-visible { color:var(--heat); outline:none; }
  footer { padding:18px 20px 26px; font-size:11px; letter-spacing:0.08em; color:#555b67; text-align:center; }
</style>
</head>
<body>
  <main>
    <h1>Thermius</h1>
    <div class="sub">Space Systems</div>
    <div class="rule" aria-hidden="true"></div>
    <p class="line">Thermal and test solutions for space systems.</p>
    <div class="contact">
      <span>St. Petersburg, Florida</span>
      <a href="mailto:nick@thermius.space">nick@thermius.space</a>
    </div>
  </main>
  <footer>&copy; 2026 Thermius Space Systems Company</footer>
</body>
</html>
